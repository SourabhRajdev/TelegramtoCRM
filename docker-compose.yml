services:
  app:
    build: .
    env_file: .env
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://app:3001
    depends_on:
      - app
    restart: unless-stopped
